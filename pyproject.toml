[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abtool"
version = "0.1.0"
description = "Turn EPUB, PDF and other documents into downloadable audiobooks, on-device."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "qrcode>=7.4",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9"]

[project.scripts]
abtool = "abtool.__main__:main"

[tool.setuptools]
packages = ["abtool", "abtool.ingest", "abtool.tts"]

[tool.setuptools.package-data]
abtool = ["static/*"]
